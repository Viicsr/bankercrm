info:
  name: Update account
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base_url}}/{{version_url}}/accounts/{{account_id}}"
  body:
    type: json
    data: |-
      {
        "is_active": {{isactive}},
        "balance": {{money}}
      }
  auth: inherit

runtime:
  variables:
    - name: account_id
      value: "1"
    - name: money
      value: "120.00"
    - name: isactive
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
