info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: form-urlencoded
    data:
      - name: username
        value: testadmin@test.com
      - name: password
        value: Admin1234!
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.getBody().access_token;
        bru.setEnvVar("jwt_token", token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
