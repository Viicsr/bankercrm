info:
  name: refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/{{version_url}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refresh_token}}"
      }
  auth:
    type: bearer
    token: "{{jwt_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.getBody().access_token;
        const refresh_token = res.getBody().refresh_token
        bru.setEnvVar("jwt_token", token);
        bru.setEnvVar("refresh_token", refresh_token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
