info:
  name: Get fx rates
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/{{version_url}}/fx/rates?currencies=USD&currencies=JPY"
  params:
    - name: currencies
      value: USD
      type: query
    - name: currencies
      value: JPY
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
