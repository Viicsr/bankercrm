services:
  db:
    image: postgres:16-alpine
    container_name: bankercrm-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vicsr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankercrm123}
      POSTGRES_DB: ${POSTGRES_DB:-bankercrm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vicsr} -d ${POSTGRES_DB:-bankercrm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bankercrm-network

  app:
    build:
      context: .
      target: runtime
    container_name: bankercrm-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vicsr}:${POSTGRES_PASSWORD:-bankercrm123}@db:5432/${POSTGRES_DB:-bankercrm}
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-BankCRM}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy  # espera a que PostgreSQL esté listo
    networks:
      - bankercrm-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: bankercrm_postgres_data

networks:
  bankercrm-network:
    name: bankercrm-network